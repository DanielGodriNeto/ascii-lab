<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubo de Rubik ASCII</title>
<style>
  :root { --bg:#0b0d10; --fg:#cfd6dd; --dim:#7b8794; --line:#222a33; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-monospace,Consolas,monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
  header h1 { font-size:14px; margin:0 8px 0 0; font-weight:600; }
  button, select { background:#151a20; color:var(--fg); border:1px solid var(--line); padding:5px 10px; font:inherit; cursor:pointer; border-radius:4px; }
  button:hover, select:hover { border-color:#3a4654; }
  label { color:var(--dim); display:flex; align-items:center; gap:6px; }
  input[type=range] { width:110px; }
  #stage { flex:1; min-height:0; overflow:hidden; display:flex; justify-content:center; align-items:center; }
  #stage table { cursor:grab; user-select:none; }
  #stage table:active { cursor:grabbing; }
  footer { padding:8px 16px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; }
  kbd { border:1px solid var(--line); padding:0 4px; border-radius:3px; color:var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Cubo de Rubik ASCII</h1>
  <button id="scramble">Embaralhar</button>
  <button id="reset">Resetar</button>
  <label>Resolução <input id="res" type="range" min="0.1" max="0.45" step="0.01" value="0.22"></label>
  <label>Velocidade <input id="spd" type="range" min="80" max="600" step="10" value="260"></label>
  <label>Caracteres
    <select id="chars">
      <option value=" .:-=+*#%@">clássico</option>
      <option value=" .oO0@">suave</option>
      <option value=" █">blocos</option>
      <option value=" 01">binário</option>
    </select>
  </label>
  <label><input id="color" type="checkbox" checked> Cores</label>
  <label><input id="auto" type="checkbox"> Girar sozinho</label>
</header>
<div id="stage"></div>
<footer>
  Arraste com o mouse para girar o cubo inteiro, roda do mouse dá zoom. Camadas:
  <kbd>U</kbd> <kbd>D</kbd> <kbd>L</kbd> <kbd>R</kbd> <kbd>F</kbd> <kbd>B</kbd> (com <kbd>Shift</kbd> gira ao contrário).
</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const stage = $('stage');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(5.5, 4.5, 7);
const renderer = new THREE.WebGLRenderer();
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 8, 6);
scene.add(sun);

let effect, controls;
function buildEffect() {
  if (effect) stage.innerHTML = '';
  effect = new AsciiEffect(renderer, $('chars').value, {
    invert: true, resolution: +$('res').value, scale: 1, color: $('color').checked,
  });
  effect.domElement.style.color = '#cfd6dd';
  effect.domElement.style.backgroundColor = '#0b0d10';
  stage.appendChild(effect.domElement);
  if (controls) controls.dispose();
  controls = new OrbitControls(camera, effect.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 5;
  controls.maxDistance = 20;
  resize();
}
function resize() {
  const s = Math.min(stage.clientWidth, stage.clientHeight);
  camera.aspect = 1;
  camera.updateProjectionMatrix();
  effect.setSize(s, s);
}

// --- cubo: 27 cubies, cada um com corpo escuro e adesivos nas faces externas ---
const COLORS = { '+x':0xe53935, '-x':0xff8f00, '+y':0xf5f5f5, '-y':0xfdd835, '+z':0x1e9e4a, '-z':0x1e5fd6 };
const cube = new THREE.Group();
scene.add(cube);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a2f36, roughness: 0.8 });
const bodyGeo = new THREE.BoxGeometry(0.96, 0.96, 0.96);
const stickerGeo = new THREE.PlaneGeometry(0.8, 0.8);
let cubies = [];

function buildCube() {
  cubies.forEach(c => cube.remove(c));
  cubies = [];
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    const c = new THREE.Group();
    c.add(new THREE.Mesh(bodyGeo, bodyMat));
    const faces = [[x,'x'],[y,'y'],[z,'z']];
    for (const [v, a] of faces) {
      if (!v) continue;
      const key = (v > 0 ? '+' : '-') + a;
      const m = new THREE.Mesh(stickerGeo, new THREE.MeshStandardMaterial({ color: COLORS[key], roughness: 0.5 }));
      m.position[a] = v * 0.485;
      if (a === 'x') m.rotation.y = Math.PI / 2 * v;
      if (a === 'y') m.rotation.x = -Math.PI / 2 * v;
      if (a === 'z' && v < 0) m.rotation.y = Math.PI;
      c.add(m);
    }
    c.position.set(x, y, z);
    cube.add(c);
    cubies.push(c);
  }
}

// --- movimentos: fila + animação de uma camada por vez ---
const SIGN = { U:-1, D:1, R:-1, L:1, F:-1, B:1 };
const AXIS = { U:'y', D:'y', R:'x', L:'x', F:'z', B:'z' };
const LAYER = { U:1, D:-1, R:1, L:-1, F:1, B:-1 };
const queue = [];
let current = null;

function startMove({ face, inv }) {
  const axis = AXIS[face], layer = LAYER[face];
  const pivot = new THREE.Group();
  cube.add(pivot);
  const group = cubies.filter(c => Math.round(c.position[axis]) === layer);
  group.forEach(c => pivot.attach(c));
  current = { pivot, group, axis, angle: SIGN[face] * (inv ? -1 : 1) * Math.PI / 2, t0: performance.now() };
}
function finishMove() {
  const { pivot, group } = current;
  group.forEach(c => {
    cube.attach(c);
    c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
    const m = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
    m.elements = m.elements.map(Math.round);
    c.quaternion.setFromRotationMatrix(m);
  });
  cube.remove(pivot);
  current = null;
}
function stepMoves(now) {
  if (!current && queue.length) startMove(queue.shift());
  if (!current) return;
  const t = Math.min((now - current.t0) / +$('spd').value, 1);
  const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; // ease in-out
  current.pivot.rotation[current.axis] = current.angle * e;
  if (t >= 1) finishMove();
}

addEventListener('keydown', e => {
  const face = e.key.toUpperCase();
  if (!(face in AXIS) || e.ctrlKey || e.metaKey || e.altKey) return;
  queue.push({ face, inv: e.shiftKey });
});
$('scramble').onclick = () => {
  const faces = Object.keys(AXIS);
  for (let i = 0; i < 20; i++) queue.push({ face: faces[Math.random() * 6 | 0], inv: Math.random() < 0.5 });
};
$('reset').onclick = () => { queue.length = 0; if (current) finishMove(); buildCube(); };
$('res').oninput = $('chars').onchange = $('color').onchange = buildEffect;
$('auto').onchange = e => { controls.autoRotate = e.target.checked; };
addEventListener('resize', resize);

buildCube();
buildEffect();
(function loop(now) {
  requestAnimationFrame(loop);
  stepMoves(now);
  controls.autoRotate = $('auto').checked;
  controls.update();
  effect.render(scene, camera);
})(performance.now());
</script>
</body>
</html>
